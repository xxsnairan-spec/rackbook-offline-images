name: Prepare PostgreSQL offline image
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: postgres-offline-image
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Export official PostgreSQL amd64 image
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          source_image=docker.io/library/postgres:18.6-bookworm
          local_image=rackbook-offline/postgres:18.6-bookworm-amd64
          output_dir=${1:-postgres-offline-18.6-amd64}
          mkdir -p -- "$output_dir"
          output_dir=$(cd -- "$output_dir" && pwd)
          if [[ -e "$output_dir/postgres-18.6-bookworm-amd64.tar.gz" ]]; then
            printf 'Output already exists. Choose another directory.\n' >&2
            exit 1
          fi
          docker pull --platform=linux/amd64 "$source_image"
          platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$source_image")
          [[ "$platform" == linux/amd64 ]] || { printf 'Unexpected platform: %s\n' "$platform" >&2; exit 1; }
          image_id=$(docker image inspect --format '{{.Id}}' "$source_image")
          source_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$source_image")
          docker tag "$source_image" "$local_image"
          docker image save "$local_image" | gzip -1 > "$output_dir/postgres-18.6-bookworm-amd64.tar.gz"
          printf '%s\n' "$image_id" > "$output_dir/IMAGE_ID.txt"
          printf 'source=%s\nsource_digest=%s\nlocal_tag=%s\nplatform=%s\nimage_id=%s\ncreated_utc=%s\n' \
            "$source_image" "$source_digest" "$local_image" "$platform" "$image_id" "$(date -u +%FT%TZ)" > "$output_dir/SOURCE.txt"
          (
            cd -- "$output_dir"
            sha256sum postgres-18.6-bookworm-amd64.tar.gz IMAGE_ID.txt SOURCE.txt > SHA256SUMS
          )
          printf 'Offline image files ready: %s\n' "$output_dir"
      - name: Upload files to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_tag="postgres-offline-18.6-amd64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$release_tag" \
            --target "$GITHUB_SHA" --draft \
            --title "PostgreSQL 18.6 bookworm amd64 offline image" \
            --notes "Official docker.io/library/postgres image exported for RackBook database deployment. SOURCE.txt records the upstream digest and local image ID. Contains no RackBook source or secrets. Download all four assets. This draft is visible to repository maintainers; publish only if you intend public distribution." \
            postgres-offline-18.6-amd64/postgres-18.6-bookworm-amd64.tar.gz \
            postgres-offline-18.6-amd64/IMAGE_ID.txt \
            postgres-offline-18.6-amd64/SOURCE.txt \
            postgres-offline-18.6-amd64/SHA256SUMS
